AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Version mejorada de la solucion de referencia para IaC avanzada en AWS.
  Incorpora una regla de lifecycle en S3, un output adicional de URL regional,
  tags estratégicos para compliance y outputs enriquecidos para operaciones.

Parameters:
  ProjectName:
    Type: String
    Default: iaclab
    AllowedPattern: '^[a-z0-9-]{3,15}$'
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.20.1.0/24
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
  Owner:
    Type: String
    Default: alumno
  CostCenter:
    Type: String
    Default: training
  EnableBucketVersioning:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  # NUEVOS PARÁMETROS PARA TAGS ESTRATÉGICOS
  BusinessUnit:
    Type: String
    Default: technology
    Description: Unidad de negocio responsable
    AllowedPattern: '^[a-z]{3,20}$'
  DataClassification:
    Type: String
    Default: internal
    AllowedValues: [public, internal, confidential, restricted]
    Description: Clasificación de datos para compliance

Conditions:
  BucketVersioningEnabled: !Equals [!Ref EnableBucketVersioning, 'true']

Resources:
  MainVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpc'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: CloudFormation
        - Key: SolutionVersion
          Value: v2
        # NUEVOS TAGS ESTRATÉGICOS
        - Key: BusinessUnit
          Value: !Ref BusinessUnit
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedDate
          Value: !Sub '${AWS::StackName}-${AWS::Region}-${AWS::AccountId}'
        - Key: Backup
          Value: 'not-applicable'
        - Key: Monitoring
          Value: 'enabled'
        - Key: ResourceType
          Value: 'network'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-igw'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: CloudFormation
        - Key: SolutionVersion
          Value: v2
        # NUEVOS TAGS ESTRATÉGICOS
        - Key: BusinessUnit
          Value: !Ref BusinessUnit
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedDate
          Value: !Sub '${AWS::StackName}-${AWS::Region}-${AWS::AccountId}'
        - Key: Backup
          Value: 'not-applicable'
        - Key: Monitoring
          Value: 'enabled'
        - Key: ResourceType
          Value: 'network'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref MainVPC

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MainVPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-rt'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: CloudFormation
        - Key: SolutionVersion
          Value: v2
        # NUEVOS TAGS ESTRATÉGICOS
        - Key: BusinessUnit
          Value: !Ref BusinessUnit
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedDate
          Value: !Sub '${AWS::StackName}-${AWS::Region}-${AWS::AccountId}'
        - Key: Backup
          Value: 'not-applicable'
        - Key: Monitoring
          Value: 'enabled'
        - Key: ResourceType
          Value: 'network'

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref MainVPC
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-public-subnet'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: CloudFormation
        - Key: SolutionVersion
          Value: v2
        # NUEVOS TAGS ESTRATÉGICOS
        - Key: BusinessUnit
          Value: !Ref BusinessUnit
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedDate
          Value: !Sub '${AWS::StackName}-${AWS::Region}-${AWS::AccountId}'
        - Key: Backup
          Value: 'not-applicable'
        - Key: Monitoring
          Value: 'enabled'
        - Key: ResourceType
          Value: 'network'

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'HTTP access for ${ProjectName}-${Environment}'
      VpcId: !Ref MainVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
          Description: HTTP inbound
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-web-sg'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: CloudFormation
        - Key: SolutionVersion
          Value: v2
        # NUEVOS TAGS ESTRATÉGICOS
        - Key: BusinessUnit
          Value: !Ref BusinessUnit
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedDate
          Value: !Sub '${AWS::StackName}-${AWS::Region}-${AWS::AccountId}'
        - Key: Backup
          Value: 'not-applicable'
        - Key: Monitoring
          Value: 'enabled'
        - Key: ResourceType
          Value: 'security'

  SecureDataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: !If [BucketVersioningEnabled, Enabled, Suspended]
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-bucket'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: CloudFormation
        - Key: SolutionVersion
          Value: v2
        # NUEVOS TAGS ESTRATÉGICOS
        - Key: BusinessUnit
          Value: !Ref BusinessUnit
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedDate
          Value: !Sub '${AWS::StackName}-${AWS::Region}-${AWS::AccountId}'
        - Key: Backup
          Value: !If [BucketVersioningEnabled, 'required', 'optional']
        - Key: Monitoring
          Value: 'enabled'
        - Key: ResourceType
          Value: 'storage'

  NotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-${Environment}-alerts'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alerts'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Owner
          Value: !Ref Owner
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: ManagedBy
          Value: CloudFormation
        - Key: SolutionVersion
          Value: v2
        # NUEVOS TAGS ESTRATÉGICOS
        - Key: BusinessUnit
          Value: !Ref BusinessUnit
        - Key: DataClassification
          Value: !Ref DataClassification
        - Key: CreatedDate
          Value: !Sub '${AWS::StackName}-${AWS::Region}-${AWS::AccountId}'
        - Key: Backup
          Value: 'not-applicable'
        - Key: Monitoring
          Value: 'enabled'
        - Key: ResourceType
          Value: 'messaging'

# OUTPUTS ENRIQUECIDOS
Outputs:
  # Outputs básicos mejorados con exports
  VpcId:
    Description: 'ID de la VPC creada para conectividad de red'
    Value: !Ref MainVPC
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'

  PublicSubnetId:
    Description: 'ID de la subred pública para recursos con acceso a internet'
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId'

  SecurityGroupId:
    Description: 'ID del Security Group para tráfico HTTP'
    Value: !Ref WebSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-WebSecurityGroupId'

  BucketName:
    Description: 'Nombre del bucket S3 securizado para almacenamiento'
    Value: !Ref SecureDataBucket
    Export:
      Name: !Sub '${AWS::StackName}-SecureDataBucket'

  BucketArn:
    Description: 'ARN del bucket S3 para políticas IAM'
    Value: !GetAtt SecureDataBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-BucketArn'

  BucketRegionalDomainName:
    Description: 'Dominio regional del bucket S3 para aplicaciones'
    Value: !GetAtt SecureDataBucket.RegionalDomainName

  SnsTopicArn:
    Description: 'ARN del topic SNS para notificaciones'
    Value: !Ref NotificationsTopic
    Export:
      Name: !Sub '${AWS::StackName}-SnsTopicArn'

  # NUEVOS OUTPUTS OPERACIONALES
  StackInfo:
    Description: 'Información del stack para referencia operacional'
    Value: !Sub 
      - 'Stack: ${StackName} | Region: ${Region} | Account: ${Account} | Environment: ${Env}'
      - StackName: !Ref 'AWS::StackName'
        Region: !Ref 'AWS::Region'
        Account: !Ref 'AWS::AccountId'
        Env: !Ref Environment

  ResourceSummary:
    Description: 'Resumen de configuración de recursos creados'
    Value: !Sub 
      - 'VPC: ${VpcCidr} | Subnet: ${SubnetCidr} | Bucket Versioning: ${BucketVersioning} | Environment: ${Env}'
      - VpcCidr: !Ref VpcCidr
        SubnetCidr: !Ref PublicSubnetCidr
        BucketVersioning: !If [BucketVersioningEnabled, 'Enabled', 'Disabled']
        Env: !Ref Environment

  ConsoleLinks:
    Description: 'Enlaces directos a la consola de AWS para gestión'
    Value: !Sub 
      - 'VPC: https://console.aws.amazon.com/vpc/home?region=${Region}#vpcs:VpcId=${VpcId} | S3: https://console.aws.amazon.com/s3/buckets/${BucketName}?region=${Region}'
      - Region: !Ref 'AWS::Region'
        VpcId: !Ref MainVPC
        BucketName: !Ref SecureDataBucket

  ComplianceInfo:
    Description: 'Información de compliance y seguridad para auditorías'
    Value: !Sub 
      - 'DataClass: ${DataClass} | BusinessUnit: ${BizUnit} | Encryption: AES256 | PublicAccess: Blocked | Versioning: ${Versioning}'
      - DataClass: !Ref DataClassification
        BizUnit: !Ref BusinessUnit
        Versioning: !If [BucketVersioningEnabled, 'Enabled', 'Disabled']

  TaggingStrategy:
    Description: 'Estrategia de etiquetado implementada'
    Value: !Sub 
      - 'Owner: ${Owner} | CostCenter: ${CostCenter} | BusinessUnit: ${BizUnit} | Environment: ${Env} | ManagedBy: CloudFormation'
      - Owner: !Ref Owner
        CostCenter: !Ref CostCenter
        BizUnit: !Ref BusinessUnit
        Env: !Ref Environment
